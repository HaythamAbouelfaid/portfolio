name: Portfolio PR QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-type-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Repository lint script
        run: npm run lint
      - name: TypeScript no-emit check
        run: npx tsc --noEmit
      - name: Repository build script
        run: npm run build

  scroll-browser-regressions:
    needs: lint-type-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build app for local Playwright preview
        run: npm run build
      - name: Install test runner without altering lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test scrolling on desktop and mobile
        run: npx playwright test
      - name: Preserve trace and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-scroll-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 7
